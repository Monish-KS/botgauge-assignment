version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: botgauge_postgres
    environment:
      POSTGRES_USER: botgauge_user
      POSTGRES_PASSWORD: botgauge_pass
      POSTGRES_DB: botgauge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
